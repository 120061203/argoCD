services:
  fastapi:
    build:
      context: ./app
      dockerfile: Dockerfile
    ports:
      - "8001:8000"
    volumes:
      - sqlite_data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 10s
      timeout: 5s
      retries: 3

volumes:
  sqlite_data:
