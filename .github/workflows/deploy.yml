name: Build and Deploy

on:
  push:
    branches:
      - dev
    paths:
      - 'app/**'

jobs:
  build-and-update:
    runs-on: ubuntu-latest
    environment: DockerHUB

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GH_PAT }}

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./app
          push: true
          tags: |
            ${{ vars.DOCKERHUB_USERNAME }}/argocd-exercise0527:${{ env.IMAGE_TAG }}
            ${{ vars.DOCKERHUB_USERNAME }}/argocd-exercise0527:latest

      - name: Update deployment.yaml
        run: |
          sed -i "s|image: .*/argocd-exercise0527:.*|image: ${{ vars.DOCKERHUB_USERNAME }}/argocd-exercise0527:${{ env.IMAGE_TAG }}|" k8s/deployment.yaml

      - name: Commit and push deployment.yaml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add k8s/deployment.yaml
          git commit -m "Update image tag to ${{ env.IMAGE_TAG }}"
          git push
